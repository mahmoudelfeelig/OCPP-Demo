name: ocpp-backend-demo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - deploy/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro

  backend:
    image: ghcr.io/${GHCR_OWNER:-replace-me}/ocpp-backend-demo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - deploy/.env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    image: ghcr.io/${GHCR_OWNER:-replace-me}/ocpp-backend-demo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - deploy/.env
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    image: ghcr.io/${GHCR_OWNER:-replace-me}/ocpp-backend-demo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - deploy/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  simulator:
    image: ghcr.io/${GHCR_OWNER:-replace-me}/ocpp-backend-demo-simulator:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - deploy/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2.8-alpine
    container_name: ocpp-demo-edge
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      simulator:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - ./deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    networks:
      - default
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz | grep -qi ok"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

networks:
  web:
    external: true
