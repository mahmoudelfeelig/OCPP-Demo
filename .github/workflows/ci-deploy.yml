name: ci-deploy

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator dependencies
        working-directory: simulator
        run: pip install -r requirements-dev.txt
      - name: Run simulator tests
        working-directory: simulator
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend smoke
        working-directory: frontend
        run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build Compose stack
        run: docker compose build
      - name: Start Compose stack
        run: docker compose up -d
      - name: Run Compose smoke
        run: ./scripts/compose-smoke.sh
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  build-and-push:
    if: github.event_name == 'push'
    needs:
      - backend-tests
      - simulator-tests
      - frontend-build
      - compose-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: ${{ github.repository_owner }}
      IMAGE_TAG: latest
      SHA_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ocpp-backend-demo-backend:latest
            ghcr.io/${{ github.repository_owner }}/ocpp-backend-demo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ocpp-backend-demo-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ocpp-backend-demo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push simulator image
        uses: docker/build-push-action@v6
        with:
          context: ./simulator
          file: ./simulator/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ocpp-backend-demo-simulator:latest
            ghcr.io/${{ github.repository_owner }}/ocpp-backend-demo-simulator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose --env-file deploy/.env -f docker-compose.prod.yml pull
            docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
