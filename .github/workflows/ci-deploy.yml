name: ci-deploy

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest

  simulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install simulator dependencies
        working-directory: simulator
        run: pip install -r requirements-dev.txt
      - name: Run simulator tests
        working-directory: simulator
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend smoke
        working-directory: frontend
        run: npm test

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build Compose stack
        run: docker compose build
      - name: Start Compose stack
        run: docker compose up -d
      - name: Run Compose smoke
        run: bash ./scripts/compose-smoke.sh
      - name: Show service status
        if: always()
        run: docker compose ps
      - name: Show service logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-tests
      - simulator-tests
      - frontend-build
      - compose-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
